[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fakturama-auto"
version = "0.1.0"
description = "Image-to-cash automation for Fakturama: order image -> saved Order -> linked Invoice"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=1.0.0",
    "pillow>=10.0.0",
    "pydantic>=2.6.0",
    "pywinauto>=0.6.8",
    "comtypes>=1.2.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
fakturama-auto = "fakturama_auto.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
